name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v3

      # =========================
      # PYTHON SETUP
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # 🧪 YOLO TEST
      # =========================
      - name: Run YOLO Test
        run: |
          python test_yolo.py

      # =========================
      # 🧠 AIM ENGINE TEST
      # =========================
      - name: Run Aim Engine Test
        run: |
          python test_aim_engine.py

      - name: Upload test output image
        uses: actions/upload-artifact@v4
        with:
          name: aim-test-result
          path: aim_result.jpg
