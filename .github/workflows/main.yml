name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # =========================
      # SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # =========================
      # BUILD EXE
      # =========================
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --add-data "models;models" main.py

      # =========================
      # UPLOAD ARTIFACT
      # =========================
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: overlay-exe
          path: dist/
